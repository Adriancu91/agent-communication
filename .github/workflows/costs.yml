name: costs
# Monthly consumption report: logs/costs/<month>.md + a message to Adrian. No model involved.
on:
  schedule:
    - cron: "13 6 1 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "YYYY-MM (implicit: luna trecută)"
        default: ""

permissions: {}

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Report
        env:
          MONTH_IN: ${{ inputs.month }}
        run: |
          MONTH="$MONTH_IN"
          case "$MONTH" in ""|[0-9][0-9][0-9][0-9]-[0-9][0-9]) ;; *) echo "lună invalidă"; exit 1 ;; esac
          [ -n "$MONTH" ] || MONTH=$(date -u -d "$(date -u +%Y-%m-01) -1 day" +%Y-%m)
          if [ -f "logs/costs/$MONTH.md" ]; then echo "Raportul pentru $MONTH există deja."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/trusted" && cp tools/acp.py protocol/config.json "$RUNNER_TEMP/trusted/"
          export ACP_CONFIG="$RUNNER_TEMP/trusted/config.json"
          BASE=$(git rev-parse HEAD)
          python3 "$RUNNER_TEMP/trusted/acp.py" costs --month "$MONTH" --write > /dev/null
          python3 "$RUNNER_TEMP/trusted/acp.py" new --from system --to adrian --type report --runtime system \
            --no-reply-expected --subject "Raport lunar de consum: $MONTH" --body-file "logs/costs/$MONTH.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "costuri: raport lunar $MONTH"
          python3 "$RUNNER_TEMP/trusted/acp.py" guard --base "$BASE" --head HEAD --mode prepush --actor "github-actions[bot]"
          git push -q origin HEAD:main
